<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g stroke="#00f5a0" stroke-opacity="0.02" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  
  <!-- Constellation connections (subtle lines) -->
  <g stroke="#00f5a0" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="4 8">
    <!-- Backend cluster connections -->
    <path d="M150,100 L150,200 L350,200 L350,100 Z" fill="none">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Frontend cluster -->
    <path d="M450,100 L450,200 L650,200 L650,100 Z" fill="none">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <!-- Database cluster -->
    <path d="M150,300 L150,400 L350,400 L350,300 Z" fill="none">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
    <!-- Infra cluster -->
    <path d="M450,300 L450,400 L650,400 L650,300 Z" fill="none">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="4s" begin="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Cluster labels -->
  <g font-family="monospace" font-size="9" font-weight="bold" fill="#71808a" letter-spacing="2">
    <text x="250" y="55" text-anchor="middle">BACKEND CLUSTER</text>
    <text x="550" y="55" text-anchor="middle">FRONTEND CLUSTER</text>
    <text x="250" y="370" text-anchor="middle">DATA CLUSTER</text>
    <text x="550" y="370" text-anchor="middle">INFRA CLUSTER</text>
  </g>
  
  <!-- Stars/Nodes - Backend Cluster -->
  <g filter="url(#starGlow)">
    <!-- PHP -->
    <g transform="translate(120, 120)">
      <circle r="30" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#00f5a0" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0">PHP</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">LARAVEL</text>
    </g>
    
    <!-- Go -->
    <g transform="translate(180, 180)">
      <circle r="30" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#00d9ff" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00d9ff">GO</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">MICROSVC</text>
    </g>
    
    <!-- Node.js -->
    <g transform="translate(240, 120)">
      <circle r="25" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#ffb800">NODE</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">EXPRESS</text>
    </g>
    
    <!-- REST API -->
    <g transform="translate(320, 180)">
      <circle r="25" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00f5a0">REST</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">API</text>
    </g>
    
    <!-- WebSocket -->
    <g transform="translate(380, 120)">
      <circle r="25" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00d9ff">WS</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">REALTIME</text>
    </g>
  </g>
  
  <!-- Frontend Cluster -->
  <g filter="url(#starGlow)">
    <!-- React -->
    <g transform="translate(420, 120)">
      <circle r="30" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#00d9ff" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00d9ff">REACT</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">v18+</text>
    </g>
    
    <!-- Next.js -->
    <g transform="translate(480, 180)">
      <circle r="30" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#00f5a0" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0">NEXT.JS</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">APP ROUTER</text>
    </g>
    
    <!-- TypeScript -->
    <g transform="translate(540, 120)">
      <circle r="25" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#ffb800">TS</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">STRICT</text>
    </g>
    
    <!-- Tailwind -->
    <g transform="translate(600, 180)">
      <circle r="25" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00d9ff">TW</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">CSS</text>
    </g>
    
    <!-- HTML/CSS -->
    <g transform="translate(660, 120)">
      <circle r="25" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="2.7s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00f5a0">HTML</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">CSS</text>
    </g>
  </g>
  
  <!-- Data Cluster -->
  <g filter="url(#starGlow)">
    <!-- PostgreSQL -->
    <g transform="translate(120, 320)">
      <circle r="30" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#ffb800" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffb800">POSTGRES</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">PRIMARY</text>
    </g>
    
    <!-- Redis -->
    <g transform="translate(180, 380)">
      <circle r="30" fill="#0a1117" stroke="#ff3864" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="3.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#ff3864" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ff3864">REDIS</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">CACHE/QUEUE</text>
    </g>
    
    <!-- MySQL -->
    <g transform="translate(240, 320)">
      <circle r="25" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="3.6s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00f5a0">MYSQL</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">LEGACY</text>
    </g>
  </g>
  
  <!-- Infra Cluster -->
  <g filter="url(#starGlow)">
    <!-- Docker -->
    <g transform="translate(420, 320)">
      <circle r="30" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="3.9s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#00d9ff" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00d9ff">DOCKER</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">COMPOSE</text>
    </g>
    
    <!-- Nginx -->
    <g transform="translate(480, 380)">
      <circle r="30" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="35" fill="none" stroke="#00f5a0" stroke-width="0.5" stroke-opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0">NGINX</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">PROXY/SSL</text>
    </g>
    
    <!-- CI/CD -->
    <g transform="translate(540, 320)">
      <circle r="25" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="4.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#ffb800">CI/CD</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">GITHUB ACT</text>
    </g>
    
    <!-- Linux -->
    <g transform="translate(600, 380)">
      <circle r="25" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00d9ff">LINUX</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">UBUNTU</text>
    </g>
    
    <!-- VPS -->
    <g transform="translate(660, 320)">
      <circle r="25" fill="#0a1117" stroke="#ff3864" stroke-width="1.5" stroke-opacity="0.7">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2.5s" begin="5.1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#ff3864">VPS</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">SELF-HOST</text>
    </g>
  </g>
  
  <!-- Floating particles between clusters -->
  <g fill="#00f5a0">
    <circle r="2" opacity="0.6">
      <animateMotion path="M150,150 L450,150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#00d9ff" opacity="0.6">
      <animateMotion path="M150,350 L450,350" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#ffb800" opacity="0.6">
      <animateMotion path="M450,150 L450,350" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00f5a0" opacity="0.6">
      <animateMotion path="M150,150 L150,350" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Center connecting lines -->
  <g stroke="#00f5a0" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="6 6">
    <line x1="250" y1="150" x2="400" y2="200">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="350" x2="400" y2="200">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="550" y1="150" x2="400" y2="200">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="550" y1="350" x2="400" y2="200">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Central hub -->
  <g transform="translate(400, 200)" filter="url(#glow)">
    <circle r="20" fill="#0a1117" stroke="#00f5a0" stroke-width="2" stroke-opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;16" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="36" fill="none" stroke="#00d9ff" stroke-width="0.5" stroke-opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0" letter-spacing="1">CORE</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a">STACK</text>
    <circle r="4" fill="#00f5a0">
      <animate attributeName="r" values="4;8;4" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Pulsing rings from center -->
  <g transform="translate(400, 200)" fill="none" stroke="#00f5a0" stroke-width="1" opacity="0">
    <circle r="50">
      <animate attributeName="r" values="50;120;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="50">
      <animate attributeName="r" values="50;150;50" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.2;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="50">
      <animate attributeName="r" values="50;180;50" dur="6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.1;0" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>