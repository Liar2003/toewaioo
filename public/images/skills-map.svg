    </circle>
    <circle r="3" fill="#7af7d8">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.4s" path="M400 210L710 120"/>
    </circle>
    <circle r="3" fill="#7af7d8">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="0.8s" path="M400 210L170 320"/>
    </circle>
    <circle r="3" fill="#7af7d8">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.2s" path="M400 210L630 320"/>
    </circle>
    <circle r="3" fill="#7af7d8">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="1.6s" path="M400 210L400 58"/>
    </circle>
  </g>
</svg>
    <circle r="2" fill="#ff3864" opacity="0.8">
      <animateMotion path="M300,150 L300,215" dur="1.5s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Legend -->
