<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="300" fill="url(#bgGrad)"/>
  
  <!-- Grid -->
  <g stroke="#00f5a0" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="300"/>
    <line x1="180" y1="0" x2="180" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="420" y1="0" x2="420" y2="300"/>
    <line x1="540" y1="0" x2="540" y2="300"/>
  </g>
  
  <!-- Skill nodes with connections -->
  <g filter="url(#glow)">
    <!-- Central node: FULL-STACK -->
    <g transform="translate(300, 150)" filter="url(#nodeGlow)">
      <circle r="50" fill="#0a1117" stroke="#00f5a0" stroke-width="2" stroke-opacity="0.8">
        <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="55" fill="none" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00f5a0" letter-spacing="1.5">FULL-STACK</text>
      <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">ENGINEER</text>
      <!-- Pulsing core -->
      <circle r="8" fill="#00f5a0" opacity="0.9">
        <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;1;0.9" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Backend node -->
    <g transform="translate(100, 80)">
      <circle r="40" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.7"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00f5a0" letter-spacing="1">BACKEND</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">PHP • GO • LARAVEL</text>
      <circle r="6" fill="#00f5a0" opacity="0.7">
        <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Frontend node -->
    <g transform="translate(500, 80)">
      <circle r="40" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.7"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00d9ff" letter-spacing="1">FRONTEND</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">REACT • NEXT.JS • TS</text>
      <circle r="6" fill="#00d9ff" opacity="0.7">
        <animate attributeName="r" values="6;9;6" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Database node -->
    <g transform="translate(100, 220)">
      <circle r="40" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-opacity="0.7"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ffb800" letter-spacing="1">DATABASE</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">POSTGRES • REDIS</text>
      <circle r="6" fill="#ffb800" opacity="0.7">
        <animate attributeName="r" values="6;9;6" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- DevOps node -->
    <g transform="translate(500, 220)">
      <circle r="40" fill="#0a1117" stroke="#ff3864" stroke-width="1.5" stroke-opacity="0.7"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ff3864" letter-spacing="1">DEVOPS</text>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">DOCKER • CI/CD • LINUX</text>
      <circle r="6" fill="#ff3864" opacity="0.7">
        <animate attributeName="r" values="6;9;6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Architecture node -->
    <g transform="translate(100, 150)">
      <circle r="35" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00d9ff" letter-spacing="1">ARCHITECTURE</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SYSTEM DESIGN</text>
      <circle r="5" fill="#00d9ff" opacity="0.6">
        <animate attributeName="r" values="5;8;5" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- API node -->
    <g transform="translate(500, 150)">
      <circle r="35" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0" letter-spacing="1">API ENGINEERING</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">REST • WS • GRPC</text>
      <circle r="5" fill="#00f5a0" opacity="0.6">
        <animate attributeName="r" values="5;8;5" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Automation node -->
    <g transform="translate(300, 50)">
      <circle r="35" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffb800" letter-spacing="1">AUTOMATION</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">BOTS • WORKERS</text>
      <circle r="5" fill="#ffb800" opacity="0.6">
        <animate attributeName="r" values="5;8;5" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Security node -->
    <g transform="translate(300, 250)">
      <circle r="35" fill="#0a1117" stroke="#ff3864" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ff3864" letter-spacing="1">SECURITY</text>
      <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">AUTH • HARDENING</text>
      <circle r="5" fill="#ff3864" opacity="0.6">
        <animate attributeName="r" values="5;8;5" dur="2.5s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Connections from center to nodes -->
  <g stroke-width="1" fill="none" stroke-opacity="0.3" stroke-dasharray="4 4">
    <!-- Center to Backend -->
    <path d="M300,150 L140,80" stroke="#00f5a0">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Center to Frontend -->
    <path d="M300,150 L460,80" stroke="#00d9ff">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.1s" repeatCount="indefinite"/>
    </path>
    <!-- Center to Database -->
    <path d="M300,150 L140,220" stroke="#ffb800">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <!-- Center to DevOps -->
    <path d="M300,150 L460,220" stroke="#ff3864">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <!-- Center to Architecture -->
    <path d="M300,150 L135,150" stroke="#00d9ff">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <!-- Center to API -->
    <path d="M300,150 L465,150" stroke="#00f5a0">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <!-- Center to Automation -->
    <path d="M300,150 L300,85" stroke="#ffb800">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <!-- Center to Security -->
    <path d="M300,150 L300,215" stroke="#ff3864">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Cross connections -->
  <g stroke-width="0.5" fill="none" stroke-opacity="0.15" stroke-dasharray="3 6">
    <path d="M140,80 L460,80" stroke="#71808a">
      <animate attributeName="stroke-dashoffset" values="9;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M140,220 L460,220" stroke="#71808a">
      <animate attributeName="stroke-dashoffset" values="9;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M135,150 L465,150" stroke="#71808a">
      <animate attributeName="stroke-dashoffset" values="9;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M300,85 L300,215" stroke="#71808a">
      <animate attributeName="stroke-dashoffset" values="9;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Animated data packets flowing from center -->
  <g>
    <circle r="2.5" fill="#00f5a0" opacity="0.8">
      <animateMotion path="M300,150 L140,80" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00d9ff" opacity="0.8">
      <animateMotion path="M300,150 L460,80" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M300,150 L140,220" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ff3864" opacity="0.8">
      <animateMotion path="M300,150 L460,220" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00d9ff" opacity="0.8">
      <animateMotion path="M300,150 L135,150" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00f5a0" opacity="0.8">
      <animateMotion path="M300,150 L465,150" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M300,150 L300,85" dur="1.5s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ff3864" opacity="0.8">
      <animateMotion path="M300,150 L300,215" dur="1.5s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Legend -->
  <g transform="translate(30, 20)" font-family="monospace" font-size="7" fill="#71808a">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="0" r="3" fill="#00f5a0"/>
      <text x="12" y="4">CORE / BACKEND</text>
    </g>
    <g transform="translate(0, 16)">
      <circle cx="5" cy="0" r="3" fill="#00d9ff"/>
      <text x="12" y="4">FRONTEND / API</text>
    </g>
    <g transform="translate(0, 32)">
      <circle cx="5" cy="0" r="3" fill="#ffb800"/>
      <text x="12" y="4">DATA / AUTOMATION</text>
    </g>
    <g transform="translate(0, 48)">
      <circle cx="5" cy="0" r="3" fill="#ff3864"/>
      <text x="12" y="4">DEVOPS / SECURITY</text>
    </g>
  </g>
</svg>