<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070a"/>
      <stop offset="50%" stop-color="#071217"/>
      <stop offset="100%" stop-color="#020507"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56f7d0" stop-opacity="1"/>
      <stop offset="15%" stop-color="#00f5a0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <g opacity="0.26" stroke="#8ae3d8" stroke-width="1">
    <path d="M35 70H765M35 130H765M35 190H765M35 250H765M35 310H765M35 370H765"/>
    <path d="M120 30V390M220 30V390M320 30V390M420 30V390M520 30V390M620 30V390M720 30V390"/>
  </g>

  <g opacity="0.4" stroke="#00f5a0" stroke-width="1.1" fill="none">
    <path d="M160 150C240 90 260 90 320 150C380 210 390 210 480 150"/>
    <path d="M160 270C240 330 260 330 320 270C380 210 390 210 480 270"/>
    <path d="M240 90C180 150 180 270 240 330"/>
