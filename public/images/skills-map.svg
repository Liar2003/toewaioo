    <path d="M400 210 L710 120" stroke="#00d9ff" stroke-dasharray="6 8"/>
    <path d="M400 210 L170 320" stroke="#ffb800" stroke-dasharray="6 8"/>
    <path d="M400 210 L630 320" stroke="#ff3864" stroke-dasharray="6 8"/>
    <path d="M400 210 L120 210" stroke="#00d9ff" stroke-dasharray="6 8"/>
    <path d="M400 210 L680 210" stroke="#00f5a0" stroke-dasharray="6 8"/>
    <path d="M400 210 L400 58" stroke="#ffb800" stroke-dasharray="6 8"/>
    <path d="M400 210 L400 362" stroke="#ff3864" stroke-dasharray="6 8"/>
