<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5a0"/>
      <stop offset="50%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#ffb800"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1117"/>
      <stop offset="100%" style="stop-color:#0d1820"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="200,10 385,105 385,295 200,390 15,295 15,105"/>
    </clipPath>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Hexagonal grid background -->
  <g stroke="#00f5a0" stroke-opacity="0.03" stroke-width="0.5">
    <g transform="translate(0, 0)">
      <path d="M200,0 L400,100 L400,300 L200,400 L0,300 L0,100 Z" fill="none"/>
      <path d="M200,-150 L400,-50 L400,150 L200,250 L0,150 L0,-50 Z" fill="none"/>
      <path d="M200,150 L400,250 L400,450 L200,550 L0,450 L0,250 Z" fill="none"/>
      <path d="M-200,100 L0,200 L0,400 L-200,500 L-400,400 L-400,200 Z" fill="none"/>
      <path d="M400,100 L600,200 L600,400 L400,500 L200,400 L200,200 Z" fill="none"/>
    </g>
  </g>
  
  <!-- Outer rotating rings -->
  <g transform="translate(200, 200)">
    <!-- Ring 1 - Fast rotation -->
    <g filter="url(#glow)">
      <circle r="170" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="8 12" stroke-linecap="round" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="stroke-dashoffset" values="0;40" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Ring 2 - Medium rotation opposite direction -->
    <circle r="140" fill="none" stroke="#00d9ff" stroke-width="1" stroke-dasharray="4 8" stroke-linecap="round" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Ring 3 - Slow rotation -->
    <circle r="110" fill="none" stroke="#ffb800" stroke-width="0.5" stroke-dasharray="12 12" stroke-linecap="round" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pulsing ring -->
    <circle r="185" fill="none" stroke="#00f5a0" stroke-width="1" opacity="0">
      <animate attributeName="r" values="185;200;185" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="185" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="185;205;185" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.2;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="185" fill="none" stroke="#ffb800" stroke-width="1" opacity="0">
      <animate attributeName="r" values="185;210;185" dur="5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.15;0" dur="5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Core hexagonal avatar -->
  <g transform="translate(200, 200)" filter="url(#innerGlow)">
    <!-- Hexagon background -->
    <polygon points="200,0 346,75 346,225 200,300 54,225 54,75" fill="url(#coreGrad)" stroke="#00f5a0" stroke-width="2" stroke-opacity="0.6" clip-path="url(#hexClip)">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Inner hexagon -->
    <polygon points="200,20 326,95 326,205 200,280 74,205 74,95" fill="none" stroke="#00d9ff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Center core -->
    <circle cx="0" cy="0" r="50" fill="#0a1117" stroke="#00f5a0" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Circuit pattern in center -->
    <g stroke="#00f5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-30" x2="0" y2="-10">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="10" x2="0" x2="30">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="-30" y1="0" x2="-10" y2="0">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="10" y1="0" x2="30" y2="0">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      </line>
      <!-- Corner brackets -->
      <g transform="rotate(45)">
        <path d="M-20,-20 L-20,-35 L-35,-35" fill="none"/>
        <path d="M20,-20 L35,-20 L35,-35" fill="none"/>
        <path d="M-20,20 L-35,20 L-35,35" fill="none"/>
        <path d="M20,20 L20,35 L35,35" fill="none"/>
      </g>
    </g>
    
    <!-- Pulsing center dot -->
    <circle cx="0" cy="0" r="6" fill="#00f5a0" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating data particles -->
  <g transform="translate(200, 200)">
    <g fill="#00f5a0">
      <circle r="2.5" opacity="0.8">
        <animateMotion path="M0,-170 L170,0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" fill="#00d9ff" opacity="0.8">
        <animateMotion path="M0,-170 L-170,0" dur="5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" fill="#ffb800" opacity="0.8">
        <animateMotion path="M0,170 L170,0" dur="6s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" opacity="0.8">
        <animateMotion path="M0,170 L-170,0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Corner markers -->
  <g transform="translate(200, 200)" stroke="#00f5a0" stroke-width="2" opacity="0.5">
    <g transform="rotate(0)">
      <path d="M-190,-190 L-190,-210 L-210,-210" fill="none">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(90)">
      <path d="M-190,-190 L-190,-210 L-210,-210" fill="none">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(180)">
      <path d="M-190,-190 L-190,-210 L-210,-210" fill="none">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(270)">
      <path d="M-190,-190 L-190,-210 L-210,-210" fill="none">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>