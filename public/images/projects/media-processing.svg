<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5a0"/>
      <stop offset="100%" style="stop-color:#00d9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  
  <!-- Grid background -->
  <g stroke="#00f5a0" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="540" y1="0" x2="540" y2="340"/>
  </g>
  
  <!-- Architecture diagram -->
  <g filter="url(#glow)">
    <!-- Client -->
    <g transform="translate(40, 100)">
      <rect x="0" y="0" width="100" height="50" rx="4" fill="#0a1117" stroke="#71808a" stroke-width="1.5"/>
      <text x="50" y="32" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#71808a" letter-spacing="1.5">CLIENTS</text>
    </g>
    
    <!-- Arrow -->
    <path d="M140 125 L180 125" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="180,120 190,125 180,130" fill="#00f5a0"/>
    
    <!-- Nginx -->
    <g transform="translate(200, 100)">
      <rect x="0" y="0" width="120" height="50" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="60" y="32" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00f5a0" letter-spacing="1.5">NGINX</text>
      <text x="60" y="46" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">REVERSE PROXY</text>
    </g>
    
    <!-- Split arrows -->
    <path d="M320 125 L360 125" stroke="#00d9ff" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="360,120 370,125 360,130" fill="#00d9ff"/>
    
    <path d="M320 125 L360 65" stroke="#00d9ff" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="360,70 370,65 360,60" fill="#00d9ff"/>
    
    <!-- REST API -->
    <g transform="translate(380, 40)">
      <rect x="0" y="0" width="110" height="50" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00d9ff" letter-spacing="1">REST API</text>
      <text x="55" y="44" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">STATELESS</text>
    </g>
    
    <!-- WebSocket -->
    <g transform="translate(380, 150)">
      <rect x="0" y="0" width="110" height="50" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00d9ff" letter-spacing="1">WEBSOCKET</text>
      <text x="55" y="44" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">REALTIME</text>
    </g>
    
    <!-- Merge arrow -->
    <path d="M490 65 L510 100" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="510,100 505,90 505,110" fill="#00f5a0"/>
    
    <path d="M490 200 L510 165" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="510,165 505,175 505,155" fill="#00f5a0"/>
    
    <!-- App Layer -->
    <g transform="translate(520, 90)">
      <rect x="0" y="0" width="160" height="80" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="2"/>
      <text x="80" y="35" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00f5a0" letter-spacing="1.5">APPLICATION LAYER</text>
      <text x="80" y="50" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="1">DOMAIN LOGIC</text>
    </g>
    
    <!-- Queue arrow -->
    <path d="M680 130 L720 130" stroke="#ffb800" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="720,125 730,130 720,135" fill="#ffb800"/>
    
    <!-- Redis Queue -->
    <g transform="translate(740, 105)">
      <rect x="0" y="0" width="140" height="50" rx="4" fill="#0a1117" stroke="#ffb800" stroke-width="1.5"/>
      <text x="70" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffb800" letter-spacing="1">REDIS / QUEUE</text>
      <text x="70" y="44" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">JOB BUS</text>
    </g>
    
    <!-- Split to workers/db -->
    <path d="M880 130 L920 130" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="920,125 930,130 920,135" fill="#00f5a0"/>
    
    <path d="M880 130 L920 190" stroke="#00d9ff" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="920,185 930,180 930,190" fill="#00d9ff"/>
    
    <!-- Workers -->
    <g transform="translate(940, 105)">
      <rect x="0" y="0" width="110" height="50" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00f5a0" letter-spacing="1">WORKERS</text>
      <text x="55" y="44" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">SCALED POOL</text>
    </g>
    
    <!-- Database -->
    <g transform="translate(940, 165)">
      <rect x="0" y="0" width="130" height="50" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="65" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00d9ff" letter-spacing="1">POSTGRESQL</text>
      <text x="65" y="44" text-anchor="middle" font-family="monospace" font-size="7" fill="#71808a" letter-spacing="1">PERSISTENCE</text>
    </g>
    
    <!-- Animated particles on connections -->
    <g fill="#00f5a0">
      <circle r="3" opacity="0.8">
        <animateMotion path="M140 125 L180 125" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#00d9ff" opacity="0.8">
        <animateMotion path="M320 125 L360 125" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#00d9ff" opacity="0.8">
        <animateMotion path="M320 125 L360 65" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" opacity="0.8">
        <animateMotion path="M490 65 L510 100" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" opacity="0.8">
        <animateMotion path="M490 200 L510 165" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#ffb800" opacity="0.8">
        <animateMotion path="M680 130 L720 130" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" opacity="0.8">
        <animateMotion path="M880 130 L920 130" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#00d9ff" opacity="0.8">
        <animateMotion path="M880 130 L920 190" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Title -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00f5a0" letter-spacing="4" opacity="0.7">MEDIA PROCESSING PLATFORM</text>
</svg>