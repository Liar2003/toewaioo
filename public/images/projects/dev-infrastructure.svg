<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffb800"/>
      <stop offset="100%" style="stop-color:#ff8800"/>
    </linearGradient>
    <linearGradient id="linuxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fcc624"/>
      <stop offset="100%" style="stop-color:#e06c00"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0db7ed"/>
      <stop offset="100%" style="stop-color:#007acc"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  
  <!-- Grid background -->
  <g stroke="#ffb800" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="540" y1="0" x2="540" y2="340"/>
  </g>
  
  <g filter="url(#glow)">
    <!-- VPS / Server -->
    <g transform="translate(200, 30)">
      <rect x="0" y="0" width="200" height="140" rx="6" fill="#0a1117" stroke="url(#linuxGrad)" stroke-width="2"/>
      <text x="100" y="35" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="url(#linuxGrad)" letter-spacing="2">VPS INSTANCE</text>
      <text x="100" y="52" text-anchor="middle" font-family="monospace" font-size="9" fill="#71808a" letter-spacing="1">UBUNTU 22.04 LTS</text>
      
      <!-- Docker Engine -->
      <g transform="translate(15, 65)">
        <rect x="0" y="0" width="80" height="60" rx="4" fill="#0a1117" stroke="url(#dockerGrad)" stroke-width="1.5"/>
        <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="url(#dockerGrad)" letter-spacing="0.5">DOCKER</text>
        <text x="40" y="35" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">ENGINE</text>
        
        <!-- Containers inside -->
        <g stroke="#0db7ed" stroke-opacity="0.4" stroke-width="1">
          <rect x="8" y="45" width="64" height="8" rx="2" fill="#030508"/>
          <rect x="8" y="45" width="30" height="8" rx="2" fill="#0db7ed" fill-opacity="0.3"/>
          <rect x="8" y="55" width="64" height="8" rx="2" fill="#030508"/>
          <rect x="8" y="55" width="45" height="8" rx="2" fill="#0db7ed" fill-opacity="0.3"/>
        </g>
      </g>
      
      <!-- Nginx Container -->
      <g transform="translate(105, 65)">
        <rect x="0" y="0" width="80" height="60" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5"/>
        <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00f5a0" letter-spacing="0.5">NGINX</text>
        <text x="40" y="35" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">REVERSE PROXY</text>
        <text x="40" y="50" text-anchor="middle" font-family="monospace" font-size="7" fill="#00f5a0" letter-spacing="0.5">TLS / SSL</text>
      </g>
    </g>
    
    <!-- CI/CD Pipeline -->
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="150" height="100" rx="4" fill="#0a1117" stroke="#ffb800" stroke-width="1.5"/>
      <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffb800" letter-spacing="1">CI / CD</text>
      <text x="75" y="40" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">GITHUB ACTIONS</text>
      
      <!-- Pipeline steps -->
      <g font-family="monospace" font-size="7" fill="#ffb800" font-weight="bold">
        <text x="10" y="60">▸ BUILD</text>
        <text x="10" y="72">▸ TEST</text>
        <text x="10" y="84">▸ DEPLOY</text>
        <text x="90" y="60">▸ LINT</text>
        <text x="90" y="72">▸ SECURITY</text>
        <text x="90" y="84">▸ NOTIFY</text>
      </g>
    </g>
    
    <!-- Arrow from CI/CD to VPS -->
    <path d="M190 250 L220 130" stroke="#ffb800" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <polygon points="220,135 210,125 210,145" fill="#ffb800"/>
    
    <!-- Deploy arrow animation -->
    <circle r="3" fill="#ffb800" opacity="0.9">
      <animateMotion path="M190 250 L220 130" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Monitoring -->
    <g transform="translate(380, 30)">
      <rect x="0" y="0" width="180" height="100" rx="4" fill="#0a1117" stroke="#ff3864" stroke-width="1.5"/>
      <text x="90" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ff3864" letter-spacing="1">MONITORING</text>
      <text x="90" y="47" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">PROMETHEUS / GRAFANA</text>
      
      <!-- Metrics -->
      <g font-family="monospace" font-size="7" fill="#ff3864">
        <text x="10" y="68">CPU: ████████░░ 78%</text>
        <text x="10" y="78">RAM: ██████░░░░ 62%</text>
        <text x="10" y="88">DISK: ████░░░░░░ 45%</text>
        <text x="10" y="98">NET: ███████░░░ 72%</text>
      </g>
    </g>
    
    <!-- Logging -->
    <g transform="translate(380, 150)">
      <rect x="0" y="0" width="180" height="100" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="90" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00d9ff" letter-spacing="1">LOGGING</text>
      <text x="90" y="47" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">LOKI / PROMTAIL</text>
      
      <!-- Log lines -->
      <g font-family="monospace" font-size="6" fill="#00d9ff" opacity="0.7">
        <text x="10" y="65">[INFO] 2024-01-15 10:30:45 Request processed</text>
        <text x="10" y="74">[INFO] 2024-01-15 10:30:46 Cache hit</text>
        <text x="10" y="83">[WARN] 2024-01-15 10:30:47 Slow query</text>
        <text x="10" y="92">[INFO] 2024-01-15 10:30:48 Deploy OK</text>
      </g>
    </g>
    
    <!-- Databases -->
    <g transform="translate(40, 200)">
      <!-- Already placed CI/CD here, move databases -->
    </g>
    
    <!-- PostgreSQL -->
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="150" height="100" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00d9ff" letter-spacing="1">POSTGRESQL</text>
      <text x="75" y="42" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">PRIMARY DB</text>
      
      <!-- Connection pool -->
      <g font-family="monospace" font-size="7" fill="#00d9ff">
        <text x="10" y="62">POOL: 20/20</text>
        <text x="10" y="72">QUERIES/s: 1.2k</text>
        <text x="10" y="82">LATENCY: 2.3ms</text>
        <text x="10" y="92">BACKUP: 03:00 UTC</text>
      </g>
    </g>
    
    <!-- Redis -->
    <g transform="translate(40, 200)">
      <!-- Move to right -->
    </g>
    
    <!-- Redis - move to correct position -->
    <g transform="translate(40, 200)">
    </g>
    
    <!-- Redis at different position -->
    <g transform="translate(40, 200)">
    </g>
    
    <!-- Let me reposition Redis and Backups properly -->
  </g>
  
  <!-- Redis -->
  <g filter="url(#glow)" transform="translate(40, 200)">
  </g>
  
  <!-- Actually let me redo this properly with correct transforms -->
  <g filter="url(#glow)">
    <!-- PostgreSQL (left bottom) -->
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="150" height="100" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00d9ff" letter-spacing="1">POSTGRESQL</text>
      <text x="75" y="42" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">PRIMARY DB</text>
      <g font-family="monospace" font-size="7" fill="#00d9ff">
        <text x="10" y="62">POOL: 20/20</text>
        <text x="10" y="72">QUERIES/s: 1.2k</text>
        <text x="10" y="82">LATENCY: 2.3ms</text>
        <text x="10" y="92">BACKUP: 03:00 UTC</text>
      </g>
    </g>
    
    <!-- Redis (middle bottom) -->
    <g transform="translate(220, 200)">
      <rect x="0" y="0" width="150" height="100" rx="4" fill="#0a1117" stroke="#ffb800" stroke-width="1.5"/>
      <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ffb800" letter-spacing="1">REDIS</text>
      <text x="75" y="42" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">CACHE / QUEUE</text>
      <g font-family="monospace" font-size="7" fill="#ffb800">
        <text x="10" y="62">MEMORY: 245MB</text>
        <text x="10" y="72">OPS/s: 8.4k</text>
        <text x="10" y="82">HIT RATE: 94%</text>
        <text x="10" y="92">CLUSTER: 3 NODES</text>
      </g>
    </g>
    
    <!-- Backups (right bottom) -->
    <g transform="translate(400, 200)">
      <rect x="0" y="0" width="150" height="100" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00f5a0" letter-spacing="1">BACKUPS</text>
      <text x="75" y="42" text-anchor="middle" font-family="monospace" font-size="8" fill="#71808a" letter-spacing="0.5">S3 / MINIO</text>
      <g font-family="monospace" font-size="7" fill="#00f5a0">
        <text x="10" y="62">DAILY: ✓</text>
        <text x="10" y="72">WEEKLY: ✓</text>
        <text x="10" y="82">RETENTION: 30d</text>
        <text x="10" y="92">ENCRYPTED: AES-256</text>
      </g>
    </g>
    
    <!-- Arrows from VPS to services -->
    <path d="M300 170 L115 200" stroke="#00d9ff" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M300 170 L295 200" stroke="#ffb800" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M300 170 L475 200" stroke="#00f5a0" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Data packets from VPS -->
    <g fill="#00d9ff">
      <circle r="2.5" opacity="0.8">
        <animateMotion path="M300 170 L115 200" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#ffb800">
      <circle r="2.5" opacity="0.8">
        <animateMotion path="M300 170 L295 200" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#00f5a0">
      <circle r="2.5" opacity="0.8">
        <animateMotion path="M300 170 L475 200" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- CI/CD to VPS packet -->
    <circle r="3" fill="#ffb800" opacity="0.9">
      <animateMotion path="M190 250 L220 130" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ffb800" letter-spacing="4" opacity="0.7">PRODUCTION DEVELOPER INFRASTRUCTURE</text>
</svg>