<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#00f5a0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  
  <!-- Grid background -->
  <g stroke="#00d9ff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="540" y1="0" x2="540" y2="340"/>
  </g>
  
  <!-- Document Canvas Area -->
  <g filter="url(#glow)">
    <!-- Document background -->
    <rect x="80" y="60" width="440" height="200" rx="8" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <!-- Document title bar -->
    <rect x="80" y="60" width="440" height="36" rx="8" fill="#0d1820" stroke="#00d9ff" stroke-width="0" stroke-opacity="0.3"/>
    <text x="100" y="84" font-family="monospace" font-size="9" font-weight="bold" fill="#00d9ff" letter-spacing="1.5">COLLABORATIVE_DOCUMENT.md</text>
    <circle cx="500" cy="78" r="6" fill="#ff3864" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- User cursors with names -->
    <!-- User 1 (You) -->
    <g filter="url(#cursorGlow)">
      <path d="M150 120 L150 160 L170 140 Z" fill="#00f5a0" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0,0; 20,-10; 40,-5; 60,0; 80,-15; 100,-5; 120,0; 140,-10; 150,-5" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      </path>
      <text x="150" y="115" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00f5a0">YOU</text>
    </g>
    
    <!-- User 2 (Alice) -->
    <g filter="url(#cursorGlow)">
      <path d="M250 140 L250 180 L270 160 Z" fill="#00d9ff" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0,0; -15,10; -30,5; -45,15; -60,0; -75,-5; -90,10; -100,5" dur="3.5s" repeatCount="indefinite" calcMode="linear"/>
      </path>
      <text x="250" y="135" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#00d9ff">ALICE</text>
    </g>
    
    <!-- User 3 (Bob) -->
    <g filter="url(#cursorGlow)">
      <path d="M380 110 L380 150 L400 130 Z" fill="#ffb800" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0,0; 10,-15; 25,-5; 40,0; 55,-10; 70,-5; 85,0; 100,-15" dur="4.2s" repeatCount="indefinite" calcMode="linear"/>
      </path>
      <text x="380" y="105" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#ffb800">BOB</text>
    </g>
    
    <!-- Text content lines -->
    <g font-family="monospace" font-size="8" fill="#e8f1f5" opacity="0.6">
      <text x="110" y="125"># Project Specification</text>
      <text x="110" y="145">## Real-time Collaboration</text>
      <text x="130" y="165">- WebSocket sync <tspan fill="#00f5a0" opacity="1">▸</tspan> < 50ms latency</text>
      <text x="130" y="180">- CRDT conflict resolution</text>
      <text x="130" y="195">- Presence & cursor tracking</text>
      <text x="130" y="210">- Version history & restore</text>
      <text x="130" y="225">- Offline-first architecture</text>
    </g>
    
    <!-- Selection highlights -->
    <rect x="125" y="163" width="200" height="14" fill="#00f5a0" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="270" y="178" width="180" height="14" fill="#00d9ff" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Sidebar: Comments Panel -->
  <g transform="translate(30, 60)" filter="url(#glow)">
    <rect x="0" y="0" width="45" height="200" rx="4" fill="#0a1117" stroke="#71808a" stroke-width="1" stroke-opacity="0.5"/>
    <text x="22.5" y="20" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#71808a" letter-spacing="0.5">COMMENTS</text>
    
    <!-- Comment threads -->
    <g font-family="monospace" font-size="6" fill="#e8f1f5">
      <g transform="translate(5, 35)">
        <circle cx="3" cy="3" r="3" fill="#00f5a0" opacity="0.8"/>
        <text x="10" y="8" opacity="0.8">Line 12</text>
        <text x="10" y="18" fill="#71808a" opacity="0.6">Add caching layer</text>
      </g>
      <g transform="translate(5, 65)">
        <circle cx="3" cy="3" r="3" fill="#00d9ff" opacity="0.8">
          <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="10" y="8" opacity="0.8">Line 28</text>
        <text x="10" y="18" fill="#71808a" opacity="0.6">Fix race condition</text>
      </g>
      <g transform="translate(5, 95)">
        <circle cx="3" cy="3" r="3" fill="#ffb800" opacity="0.8"/>
        <text x="10" y="8" opacity="0.8">Line 45</text>
        <text x="10" y="18" fill="#71808a" opacity="0.6">Update types</text>
      </g>
    </g>
  </g>
  
  <!-- Sidebar: Version History -->
  <g transform="translate(525, 60)" filter="url(#glow)">
    <rect x="0" y="0" width="45" height="200" rx="4" fill="#0a1117" stroke="#71808a" stroke-width="1" stroke-opacity="0.5"/>
    <text x="22.5" y="20" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#71808a" letter-spacing="0.5">HISTORY</text>
    
    <g font-family="monospace" font-size="6" fill="#e8f1f5">
      <g transform="translate(5, 35)">
        <circle cx="3" cy="3" r="3" fill="#00f5a0" opacity="0.9">
          <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="10" y="8" fill="#00f5a0">v3.2</text>
        <text x="10" y="18" fill="#71808a" opacity="0.6">2 min ago</text>
      </g>
      <g transform="translate(5, 65)">
        <circle cx="3" cy="3" r="3" fill="#00d9ff" opacity="0.7"/>
        <text x="10" y="8">v3.1</text>
        <text x="10" y="18" fill="#71808a" opacity="0.6">15 min ago</text>
      </g>
      <g transform="translate(5, 95)">
        <circle cx="3" cy="3" r="3" fill="#71808a" opacity="0.5"/>
        <text x="10" y="8">v3.0</text>
        <text x="10" y="18" fill="#71808a" opacity="0.4">1 hour ago</text>
      </g>
      <g transform="translate(5, 125)">
        <circle cx="3" cy="3" r="3" fill="#71808a" opacity="0.4"/>
        <text x="10" y="8">v2.8</text>
        <text x="10" y="18" fill="#71808a" opacity="0.3">3 hours ago</text>
      </g>
    </g>
  </g>
  
  <!-- Connection indicators at bottom -->
  <g transform="translate(80, 275)">
    <g font-family="monospace" font-size="8" fill="#e8f1f5">
      <!-- Connection status -->
      <circle cx="10" cy="10" r="5" fill="#00f5a0" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="14">SYNC: ACTIVE</text>
      
      <text x="180" y="14" fill="#00d9ff">LATENCY: 32ms</text>
      
      <text x="380" y="14" fill="#ffb800">USERS: 3 ONLINE</text>
      
      <text x="520" y="14" fill="#71808a">LAST SAVED: NOW</text>
    </g>
  </g>
  
  <!-- Animated data packets between clients and server -->
  <g fill="#00d9ff">
    <circle r="2.5" opacity="0.8">
      <animateMotion path="M150 140 L300 170" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#00f5a0" opacity="0.8">
      <animateMotion path="M250 160 L300 170" dur="1s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#ffb800" opacity="0.8">
      <animateMotion path="M380 130 L300 170" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#00d9ff" opacity="0.8">
      <animateMotion path="M300 170 L150 140" dur="1.2s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#00f5a0" opacity="0.8">
      <animateMotion path="M300 170 L250 160" dur="1s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#ffb800" opacity="0.8">
      <animateMotion path="M300 170 L380 130" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="300" y="320" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00d9ff" letter-spacing="3" opacity="0.7">REAL-TIME COLLABORATION SUITE</text>
</svg>