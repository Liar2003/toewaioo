<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="serviceGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  
  <!-- Grid background -->
  <g stroke="#ffb800" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="540" y1="0" x2="540" y2="340"/>
  </g>
  
  <!-- Client -->
  <g transform="translate(40, 150)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="40" rx="4" fill="#0a1117" stroke="#71808a" stroke-width="1.5"/>
    <text x="40" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#71808a" letter-spacing="1">CLIENT</text>
  </g>
  
  <!-- API Gateway -->
  <g transform="translate(160, 140)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="120" height="60" rx="6" fill="#0a1117" stroke="#ffb800" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="28" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ffb800" letter-spacing="1">API GATEWAY</text>
    <text x="60" y="42" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">KONG / ENVOY</text>
    <text x="60" y="54" text-anchor="middle" font-family="monospace" font-size="6" fill="#00f5a0" letter-spacing="0.5">RATE LIMIT • AUTH • ROUTING</text>
  </g>
  
  <!-- Service Layer - Top Row -->
  <!-- Catalog Service -->
  <g transform="translate(40, 40)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0" letter-spacing="1">CATALOG</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SERVICE (GO)</text>
    <text x="55" y="48" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Products • Categories</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Search • Inventory</text>
    <!-- DB indicator -->
    <circle cx="95" cy="10" r="4" fill="#00f5a0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#00f5a0" opacity="0.7">PostgreSQL</text>
  </g>
  
  <!-- Cart Service -->
  <g transform="translate(170, 40)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00d9ff" letter-spacing="1">CART</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SERVICE (NODE)</text>
    <text x="55" y="48" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Session • Items</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Pricing • Coupons</text>
    <circle cx="95" cy="10" r="4" fill="#00d9ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#00d9ff" opacity="0.7">Redis</text>
  </g>
  
  <!-- Order Service -->
  <g transform="translate(300, 40)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0" letter-spacing="1">ORDER</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SERVICE (GO)</text>
    <text x="55" y="48" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Lifecycle • State</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Saga Orchestrator</text>
    <circle cx="95" cy="10" r="4" fill="#00f5a0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#00f5a0" opacity="0.7">PostgreSQL</text>
  </g>
  
  <!-- Payment Service -->
  <g transform="translate(430, 40)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#ff3864" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ff3864" letter-spacing="1">PAYMENT</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SERVICE (NODE)</text>
    <text x="55" y="48" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Stripe • PayPal</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Webhooks • Refunds</text>
    <circle cx="95" cy="10" r="4" fill="#ff3864" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#ff3864" opacity="0.7">PostgreSQL</text>
  </g>
  
  <!-- Service Layer - Bottom Row -->
  <!-- Inventory Service -->
  <g transform="translate(40, 130)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0" letter-spacing="1">INVENTORY</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SERVICE (GO)</text>
    <text x="55" y="48" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Reservation</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Compensation Logic</text>
    <circle cx="95" cy="10" r="4" fill="#00f5a0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#00f5a0" opacity="0.7">PostgreSQL</text>
  </g>
  
  <!-- Notification Service -->
  <g transform="translate(170, 130)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00d9ff" letter-spacing="1">NOTIFY</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">SERVICE (GO)</text>
    <text x="55" y="48" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Email • SMS</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">Push • Webhook</text>
    <circle cx="95" cy="10" r="4" fill="#00d9ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#00d9ff" opacity="0.7">Redis</text>
  </g>
  
  <!-- Message Broker (RabbitMQ) - Center -->
  <g transform="translate(300, 130)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#ffb800" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffb800" letter-spacing="1">MESSAGE</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">BROKER</text>
    <text x="55" y="44" text-anchor="middle" font-family="monospace" font-size="6" fill="#ffb800" letter-spacing="0.5">RABBITMQ</text>
    <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a" letter-spacing="0.5">Exchanges • Queues</text>
    <text x="55" y="68" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a" letter-spacing="0.5">Dead Letter • DLX</text>
    <!-- Animated pulse -->
    <circle cx="55" cy="38" r="8" fill="none" stroke="#ffb800" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Tracing / Observability -->
  <g transform="translate(430, 130)" filter="url(#serviceGlow)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#0a1117" stroke="#ffb800" stroke-width="1.5" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="55" y="20" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffb800" letter-spacing="1">OBSERVE</text>
    <text x="55" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">JAEGER</text>
    <text x="55" y="44" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">PROMETHEUS</text>
    <text x="55" y="54" text-anchor="middle" font-family="monospace" font-size="6" fill="#71808a" letter-spacing="0.5">GRAFANA</text>
    <text x="55" y="64" text-anchor="middle" font-family="monospace" font-size="5" fill="#71808a" letter-spacing="0.5">Distributed Tracing</text>
  </g>
  
  <!-- Connections with animated packets -->
  <g filter="url(#glow)">
    <!-- Client to Gateway -->
    <path d="M120 170 L160 170" stroke="#ffb800" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="160,165 170,170 160,175" fill="#ffb800"/>
    
    <!-- Gateway to Services (fan out) -->
    <g stroke="#ffb800" stroke-width="1" fill="none" stroke-dasharray="5 3" opacity="0.4">
      <path d="M220 140 L95 75">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M220 140 L225 75">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.1s" repeatCount="indefinite"/>
      </path>
      <path d="M220 140 L355 75">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
      </path>
      <path d="M220 140 L485 75">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M220 200 L95 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.4s" repeatCount="indefinite"/>
      </path>
      <path d="M220 200 L225 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M220 200 L355 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M220 200 L485 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" begin="0.7s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Services to Message Broker -->
    <g stroke="#ffb800" stroke-width="1" fill="none" stroke-dasharray="4 3" opacity="0.5">
      <path d="M95 110 L355 130">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M225 110 L355 130">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
      </path>
      <path d="M355 110 L355 130">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M485 110 L355 130">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" begin="0.45s" repeatCount="indefinite"/>
      </path>
      <path d="M95 165 L355 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M225 165 L355 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" begin="0.75s" repeatCount="indefinite"/>
      </path>
      <path d="M485 165 L355 165">
        <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Broker to Observability -->
    <path d="M355 200 L485 165" stroke="#ffb800" stroke-width="1" fill="none" stroke-dasharray="4 3" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Animated message packets flowing -->
  <g>
    <!-- Client -> Gateway -->
    <circle r="2.5" fill="#ffb800" opacity="0.8">
      <animateMotion path="M120 170 L160 170" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#ffb800" opacity="0.8">
      <animateMotion path="M160 170 L120 170" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Gateway -> Services -->
    <circle r="2" fill="#00f5a0" opacity="0.8">
      <animateMotion path="M220 170 L95 75" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00d9ff" opacity="0.8">
      <animateMotion path="M220 170 L225 75" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#00f5a0" opacity="0.8">
      <animateMotion path="M220 170 L355 75" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ff3864" opacity="0.8">
      <animateMotion path="M220 170 L485 75" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Services -> Broker -->
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M95 110 L355 130" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M225 110 L355 130" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M485 110 L355 130" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M95 165 L355 165" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M225 165 L355 165" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#ffb800" opacity="0.8">
      <animateMotion path="M485 165 L355 165" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Legend -->
  <g transform="translate(300, 280)" font-family="monospace" font-size="7" fill="#71808a">
    <g transform="translate(-180, 0)">
      <circle cx="5" cy="0" r="3" fill="#00f5a0"/>
      <text x="12" y="4">GO SERVICES</text>
    </g>
    <g transform="translate(-60, 0)">
      <circle cx="5" cy="0" r="3" fill="#00d9ff"/>
      <text x="12" y="4">NODE SERVICES</text>
    </g>
    <g transform="translate(60, 0)">
      <circle cx="5" cy="0" r="3" fill="#ff3864"/>
      <text x="12" y="4">PAYMENTS</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="5" cy="0" r="3" fill="#ffb800"/>
      <text x="12" y="4">MESSAGE BUS</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="300" y="320" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ffb800" letter-spacing="3" opacity="0.7">E-COMMERCE MICROSERVICES PLATFORM</text>
</svg>