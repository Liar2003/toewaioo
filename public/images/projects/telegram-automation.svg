<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="100%" style="stop-color:#071014"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="telegramGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088cc"/>
      <stop offset="100%" style="stop-color:#00d9ff"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="340" fill="url(#bgGrad)"/>
  
  <!-- Grid background -->
  <g stroke="#0088cc" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="540" y1="0" x2="540" y2="340"/>
  </g>
  
  <g filter="url(#glow)">
    <!-- Telegram Bot API -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="160" height="60" rx="6" fill="#0a1117" stroke="url(#telegramGrad)" stroke-width="2"/>
      <text x="80" y="38" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="url(#telegramGrad)" letter-spacing="1">TELEGRAM BOT API</text>
    </g>
    
    <!-- Down arrow -->
    <path d="M120 120 L120 160" stroke="#0088cc" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="115,160 120,170 125,160" fill="#0088cc"/>
    
    <!-- Webhook / Polling -->
    <g transform="translate(40, 180)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="80" y="32" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00d9ff" letter-spacing="1">WEBHOOK / POLLING</text>
    </g>
    
    <!-- Right arrow -->
    <path d="M200 205 L240 205" stroke="#00d9ff" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="240,200 250,205 240,210" fill="#00d9ff"/>
    
    <!-- Command Router -->
    <g transform="translate(260, 180)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="80" y="32" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00f5a0" letter-spacing="1">COMMAND ROUTER</text>
    </g>
    
    <!-- Split to handlers -->
    <path d="M340 205 L380 205" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="380,200 390,205 380,210" fill="#00f5a0"/>
    
    <path d="M340 205 L380 130" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="380,135 390,130 390,140" fill="#00f5a0"/>
    
    <path d="M340 205 L380 280" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <polygon points="380,275 390,270 390,280" fill="#00f5a0"/>
    
    <!-- Handlers -->
    <g transform="translate(400, 100)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="80" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00d9ff" letter-spacing="1">CONTENT PROCESSOR</text>
    </g>
    
    <g transform="translate(400, 260)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0a1117" stroke="#ffb800" stroke-width="1.5"/>
      <text x="80" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffb800" letter-spacing="1">SUBSCRIPTION MGR</text>
    </g>
    
    <g transform="translate(400, 180)">
      <rect x="0" y="0" width="160" height="50" rx="4" fill="#0a1117" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="80" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00f5a0" letter-spacing="1">CHANNEL VERIFIER</text>
    </g>
    
    <!-- Data flow to DB -->
    <path d="M560 125 L560 205" stroke="#00d9ff" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <polygon points="555,205 560,215 565,205" fill="#00d9ff"/>
    
    <path d="M560 285 L560 245" stroke="#ffb800" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <polygon points="555,245 560,235 565,245" fill="#ffb800"/>
    
    <path d="M560 205 L560 245" stroke="#00f5a0" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <polygon points="555,245 560,235 565,245" fill="#00f5a0"/>
    
    <!-- Database -->
    <g transform="translate(450, 210)">
      <rect x="0" y="0" width="200" height="80" rx="4" fill="#0a1117" stroke="#00d9ff" stroke-width="1.5"/>
      <text x="100" y="35" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00d9ff" letter-spacing="1.5">POSTGRESQL</text>
      <text x="100" y="52" text-anchor="middle" font-family="monospace" font-size="9" fill="#71808a" letter-spacing="1">MESSAGES / USERS / SUBSCRIPTIONS</text>
      
      <!-- Table rows -->
      <g stroke="#00d9ff" stroke-opacity="0.3" stroke-width="0.5">
        <line x1="10" y1="62" x2="190" y2="62"/>
        <line x1="10" y1="72" x2="190" y2="72"/>
      </g>
    </g>
    
    <!-- Background workers -->
    <g transform="translate(50, 260)">
      <rect x="0" y="0" width="180" height="50" rx="4" fill="#0a1117" stroke="#ffb800" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffb800" letter-spacing="1">BACKGROUND JOBS</text>
    </g>
    
    <!-- Arrows from router to jobs -->
    <path d="M340 205 L140 285" stroke="#ffb800" stroke-width="1.5" fill="none" stroke-dasharray="8 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Admin panel -->
    <g transform="translate(380, 30)">
      <rect x="0" y="0" width="180" height="50" rx="4" fill="#0a1117" stroke="#ff3864" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ff3864" letter-spacing="1">ADMIN CONTROLS</text>
    </g>
    
    <!-- Rate limiter -->
    <g transform="translate(50, 30)">
      <rect x="0" y="0" width="180" height="50" rx="4" fill="#0a1117" stroke="#ffb800" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffb800" letter-spacing="1">RATE LIMITER</text>
    </g>
    
    <!-- Animated data packets -->
    <g fill="url(#telegramGrad)">
      <circle r="3" opacity="0.9">
        <animateMotion path="M120 120 L120 160" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" opacity="0.9">
        <animateMotion path="M200 205 L240 205" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" opacity="0.9">
        <animateMotion path="M340 205 L380 205" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#00d9ff" opacity="0.9">
        <animateMotion path="M340 205 L380 130" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#ffb800" opacity="0.9">
        <animateMotion path="M340 205 L380 280" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#00d9ff" opacity="0.9">
        <animateMotion path="M560 125 L560 205" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#ffb800" opacity="0.9">
        <animateMotion path="M560 285 L560 245" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Title -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#0088cc" letter-spacing="4" opacity="0.7">TELEGRAM AUTOMATION PLATFORM</text>
</svg>